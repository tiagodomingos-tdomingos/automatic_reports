name: SPR Parquet Daily Update

on:
  schedule:
    - cron: '0 11 * * *'   # 8h00 GMT-3 = 11h00 UTC
  workflow_dispatch:         # permite rodar manualmente

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas pyarrow PyJWT cryptography

      - name: Run update script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GRID_TOKEN: ${{ secrets.GRID_TOKEN }}
        run: python scripts/update_spr_parquet_ci.py
